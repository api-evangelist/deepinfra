  name: DeepInfra Platform API
  description: >-
    OpenAI- and Anthropic-compatible inference API for 100+ open-source models. Surfaces include chat
    completions, anthropic messages, embeddings, reranking, audio (speech/transcriptions/translations),
    image generation, video generation, vision/OCR, dedicated-model deployments, fine-tuning, billing,
    and account management. Base URL https://api.deepinfra.com/v1/openai (OpenAI-compatible) and https://api.deepinfra.com
    (native).
