openapi: 3.2.0
info:
  title: DeepInfra Dedicated Models API
  description: The DeepInfra API provides serverless AI inference, custom model deployments, and GPU rentals.
  version: 1.0.0
servers:
- url: https://api.deepinfra.com
tags:
- name: Dedicated Models
  description: Deploy and manage private model instances with autoscaling.
paths:
  /v1/deploy:
    post:
      tags:
      - Dedicated Models
      summary: Deploy Create
      operationId: deploy_create_v1_deploy_post
      security:
      - HTTPBearer: []
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployModelIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResult'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Conflict
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Locked
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /deploy/hf/:
    post:
      tags:
      - Dedicated Models
      summary: Deploy Create Hf
      operationId: deploy_create_hf_deploy_hf__post
      security:
      - HTTPBearer: []
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HFModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResult'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Conflict
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Locked
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /deploy/llm/gpu_availability:
    get:
      tags:
      - Dedicated Models
      summary: Deploy Gpu Availability
      operationId: deploy_gpu_availability_deploy_llm_gpu_availability_get
      security:
      - HTTPBearer: []
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Source
      - name: base_model
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Base Model
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployGPUAvailability'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /deploy/llm/suggest_name:
    get:
      tags:
      - Dedicated Models
      summary: Deploy Llm Suggest Name
      operationId: deploy_llm_suggest_name_deploy_llm_suggest_name_get
      security:
      - HTTPBearer: []
      parameters:
      - name: model_name
        in: query
        required: true
        schema:
          type: string
          title: Model Name
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelNameSuggestionOut'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /deploy/llm/standard_args:
    get:
      tags:
      - Dedicated Models
      summary: Deploy Llm Standard Args
      operationId: deploy_llm_standard_args_deploy_llm_standard_args_get
      security:
      - HTTPBearer: []
      parameters:
      - name: engine
        in: query
        required: false
        schema:
          type: string
          default: vllm
          title: Engine
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Deploy Llm Standard Args Deploy Llm Standard Args Get
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unprocessable Entity
  /deploy/llm/presets:
    get:
      tags:
      - Dedicated Models
      summary: Deploy Llm Presets
      description: 'DeepInfra presets and mirrored vLLM recipes for ``hf_repo_id``, told apart by

        ``source``; empty when none. Filter by ``gpu``/``engine``/``source``.'
      operationId: deploy_llm_presets_deploy_llm_presets_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hf_repo_id
        in: query
        required: true
        schema:
          type: string
          title: Hf Repo Id
      - name: gpu
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DeployGPUs'
          - type: 'null'
          title: Gpu
      - name: engine
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Engine
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PresetConfigOut'
                title: Response Deploy Llm Presets Deploy Llm Presets Get
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unprocessable Entity
  /deploy/llm:
    post:
