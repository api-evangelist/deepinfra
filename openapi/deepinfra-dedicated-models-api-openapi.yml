components:
  schemas:
    HFWeights:
      properties:
        repo:
          type: string
          title: Repo
          description: huggingface repository i.e username/reponame
        revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Revision
          description: commit sha or branch name
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
          description: huggingface access token with read access to the repo
      type: object
      required:
      - repo
      title: HFWeights
    RebalanceStatus:
      properties:
        replace_id:
          type: string
          title: Replace Id
          description: Id of the rebalance.
        direction:
          type: string
          enum:
          - outgoing
          - incoming
          title: Direction
          description: Whether this deployment is the source or the target.
        status:
          type: string
          title: Status
          description: Rebalance status.
          examples:
          - active
          - done
          - failed
          - cancelled
        placed:
          type: integer
          title: Placed
          description: Target instances delivered so far.
        count:
          type: integer
          title: Count
          description: Target instances requested.
        source_deploy_id:
          type: string
          title: Source Deploy Id
          description: Deploy Id of the source; empty if not yours.
          default: ''
        target_deploy_id:
          type: string
          title: Target Deploy Id
          description: Deploy Id of the target; empty if not yours.
          default: ''
        source_model_name:
          type: string
          title: Source Model Name
          description: Model name of the source; empty if not yours.
          default: ''
        target_model_name:
          type: string
          title: Target Model Name
          description: Model name of the target; empty if not yours.
          default: ''
        error:
          type: string
          title: Error
          description: Failure reason, if any.
          default: ''
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
          description: When the rebalance was requested.
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
          description: When the rebalance finished.
      type: object
      required:
      - replace_id
      - direction
      - status
      - placed
      - count
      - created_at
      title: RebalanceStatus
    GPUAvailabilityInfo:
      properties:
        gpu_config:
          type: string
          title: Gpu Config
        usd_per_hour:
          type: number
          title: Usd Per Hour
        available:
          type: boolean
          title: Available
        recommended:
          type: boolean
          title: Recommended
          default: false
      type: object
      required:
      - gpu_config
      - usd_per_hour
      - available
      title: GPUAvailabilityInfo
    ModelNameSuggestionOut:
      properties:
        model_name:
          type: string
          title: Model Name
          description: A model name that is currently free to claim (prefixed in username/model-name format).
      type: object
      required:
      - model_name
      title: ModelNameSuggestionOut
    DeployGPUs:
      type: string
      enum:
      - L4-24GB
      - L40S-48GB
      - A100-80GB
      - H100-80GB
      - H200-141GB
      - B200-180GB
      - B300-270GB
      - RTXPRO6000-96GB
      - other
      title: DeployGPUs
    DeployLLMIn:
      properties:
        model_name:
          type: string
          title: Model Name
          description: model name for deepinfra (username/mode-name format)
        gpu:
          $ref: '#/components/schemas/DeployGPUs'
          description: The type of GPU the deployment is running on.
        num_gpus:
          type: integer
          maximum: 8.0
          minimum: 1.0
          title: Num Gpus
          description: Number of GPUs used by one instance
          default: 1
        hf:
          anyOf:
          - $ref: '#/components/schemas/HFWeights'
          - type: 'null'
        base_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Model
          description: Base public model
        container_image:
          anyOf:
          - type: string
          - type: 'null'
          title: Container Image
          description: Docker image for the deployment (e.g. vllm/vllm-openai:v0.8.4)
        settings:
          anyOf:
          - $ref: '#/components/schemas/ScaleSettings'
          - type: 'null'
        extra_args:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Extra Args
          description: Extra command line arguments for custom deployments
        standard_args:
          anyOf:
          - $ref: '#/components/schemas/StandardArgs'
          - type: 'null'
          description: Engine tuning knobs. Values are validated on submission; unsupported or out-of-range values are rejected. Unset knobs use the model/engine defaults.
        preset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Preset Id
          description: Apply a stored preset or vLLM recipe by id. A non-empty standard_args or extra_args in this request replaces the preset's whole matching field.
      type: object
      required:
      - model_name
      - gpu
      title: DeployLLMIn
    RebalanceCancelIn:
      properties:
        replace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Replace Id
          description: Rebalance to cancel; defaults to the active one.
      type: object
      title: RebalanceCancelIn
    DeployGPUAvailability:
      properties:
        gpus:
          items:
            $ref: '#/components/schemas/GPUAvailabilityInfo'
          type: array
          title: Gpus
          description: A list of all provided GPUs configurations, including their price and wether they are available
      type: object
      required:
      - gpus
      title: DeployGPUAvailability
    DeployResult:
      properties:
        deploy_id:
          type: string
          title: Deploy Id
          description: Deploy Id
          examples:
          - fkj843kjh8
      type: object
      required:
      - deploy_id
      title: DeployResult
    PresetConfigOut:
      properties:
        id:
          type: string
          title: Id
          description: Preset id.
        source:
          type: string
          title: Source
          description: Config source.
          default: deepinfra
        engine:
          type: string
          title: Engine
          description: Inference engine.
          default: vllm
        gpu_configs:
          items:
            type: string
          type: array
          title: Gpu Configs
          description: Allowed Nx<GPU> configs.
        standard_args:
          properties:
            max_context_size:
              anyOf:
              - type: integer
                maximum: 10000000.0
                minimum: 1.0
              - type: 'null'
              title: Max Context Size
              description: Maximum total sequence length (prompt + generation).
            max_concurrent_requests:
              anyOf:
              - type: integer
                maximum: 1024.0
                minimum: 1.0
              - type: 'null'
              title: Max Concurrent Requests
              description: Max number of requests served concurrently.
            max_images_per_prompt:
              anyOf:
              - type: integer
                maximum: 1024.0
                minimum: 0.0
              - type: 'null'
              title: Max Images Per Prompt
              description: Images the engine accepts in one request; deepapi refuses more before rendering. 0 disables image input entirely.
            gpu_memory_fraction:
              anyOf:
              - type: number
                maximum: 0.97
                minimum: 0.5
              - type: 'null'
              title: Gpu Memory Fraction
              description: Fraction of GPU memory the engine may use for weights + KV cache.
            max_prefill_tokens:
              anyOf:
              - type: integer
                maximum: 131072.0
                minimum: 512.0
              - type: 'null'
              title: Max Prefill Tokens
              description: Max tokens processed per prefill/engine step (chunked prefill size).
            kv_cache_dtype:
              anyOf:
              - type: string
                enum:
                - auto
                - fp8
              - type: 'null'
              title: Kv Cache Dtype
              description: KV cache precision. fp8 ~doubles KV capacity at <1% accuracy loss.
            enable_prefix_caching:
              anyOf:
              - type: boolean
              - type: 'null'
              title: Enable Prefix Caching
              description: Reuse KV cache for shared prompt prefixes.
            quantization:
              anyOf:
              - type: string
                enum:
                - fp8
                - awq
                - gptq
                - awq_marlin
                - gptq_marlin
                - compressed-tensors
                - bitsandbytes
              - type: 'null'
              title: Quantization
              description: On-the-fly weight quantization method.
          additionalProperties: false
          type: object
          title: StandardArgs
          description: Engine tuning knobs.
        extra_args:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Extra Args
          description: Raw engine flags; vLLM recipes only.
        label:
          type: string
          title: Label
          description: Short display name (e.g. "Throughput-optimized").
          default: ''
      type: object
      required:
      - id
      - gpu_configs
      title: PresetConfigOut
      description: One preset deploy config for an HF model on specific hardware.
    DeployType:
      type: string
      enum:
      - legacy
      - llm
      - lora
      - tts
      title: DeployType
    DeployArgsHistoryOut:
      properties:
        entry_id:
          type: string
          title: Entry Id
          description: Identifier of this past config; pass it to POST /deploy/{deploy_id}/config/history/{entry_id}/restore.
        retired_at:
          type: string
          title: Retired At
          description: When this config was retired.
          examples:
          - '2021-08-27T17:19:21+00:00'
        standard_args:
          additionalProperties: true
          type: object
          description: Engine tuning knobs of this config.
        extra_args:
          items:
            type: string
          type: array
          title: Extra Args
          description: Extra engine-specific command-line args of this config (custom-weight deploys only).
      type: object
      required:
      - entry_id
      - retired_at
      - standard_args
      title: DeployArgsHistoryOut
    DeployInstances:
      properties:
        running:
          type: integer
          title: Running
          description: Instances serving at full capacity.
        pending:
          type: integer
          title: Pending
          description: Instances still starting up.
        warming:
          type: integer
          title: Warming
          description: Instances that are up but still warming up, so they take a reduced share of the traffic.
          default: 0
      type: object
      required:
      - running
      - pending
      title: DeployInstances
      description: 'A deployment''s capacity: running + pending + warming.'
    DeployDelete:
      properties:
        deploy_id:
          type: string
          title: Deploy Id
          description: Deploy Id
          examples:
          - fkj843kjh8
      type: object
      required:
      - deploy_id
      title: DeployDelete
    ModelProvider:
      type: string
      enum:
      - huggingface
      - deepinfra
      - cnt
      title: ModelProvider
    DeployStatusOut:
      properties:
        deploy_id:
          type: string
          title: Deploy Id
          description: Deploy Id
          examples:
          - fkj843kjh8
      type: object
      required:
      - deploy_id
      title: DeployStatusOut
    DeploymentStatsOut:
      properties:
        requests:
          type: integer
          title: Requests
          description: number of inference requests in the provided interval
        total_time:
          type: integer
          title: Total Time
          description: total number of seconds spend in inference
        total_tokens:
          type: integer
          title: Total Tokens
          description: total number of tokens generated
        input_tokens:
          type: integer
          title: Input Tokens
          description: number of input tokens generated
        output_tokens:
          type: integer
          title: Output Tokens
          description: number of output tokens generated
        total_amount:
          type: integer
          title: Total Amount
          description: total number of cents spent
        avg_time:
          type: number
          title: Avg Time
          description: average millisecond inference time
        avg95_time:
          type: number
          title: Avg95 Time
          description: 95th percentile inference time (estimated)
        errors:
          type: integer
          title: Errors
          description: number of errors
      type: object
      required:
      - requests
      - total_time
      - total_tokens
      - input_tokens
      - output_tokens
      - total_amount
      - avg_time
      - avg95_time
      - errors
      title: DeploymentStatsOut
    DeployModelIn:
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
          description: namespace for the model name
          default: cnt
        model_name:
          type: string
          title: Model Name
          description: model name in specified provider
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: A specific revision, if left empty uses the last one
      type: object
      required:
      - model_name
      title: DeployModelIn
    ScaleSettings:
      properties:
        min_instances:
          type: integer
          title: Min Instances
          description: Minimum number of model instances to run
          default: 1
        max_instances:
          type: integer
          title: Max Instances
          description: Maximum number of model instances to run
          default: 1
      type: object
      title: ScaleSettings
    RebalanceStatusOut:
      properties:
        active:
          anyOf:
          - $ref: '#/components/schemas/RebalanceStatus'
          - type: 'null'
          description: The in-flight rebalance touching this deployment.
        recent:
          items:
            $ref: '#/components/schemas/RebalanceStatus'
          type: array
          title: Recent
          description: Finished rebalances, newest first.
      type: object
      title: RebalanceStatusOut
    EmbeddingsDeploymentStatsOut:
      properties:
        requests:
          type: integer
          title: Requests
          description: number of inference requests in the provided interval
        input_tokens:
          type: integer
          title: Input Tokens
          description: number of input tokens generated
        avg_tpt_ms:
          type: number
          title: Avg Tpt Ms
          description: average millisecond time per token
        avg95_tpt_ms:
          type: number
          title: Avg95 Tpt Ms
          description: 95th percentile time per token (estimated)
        total_amount_cents:
          type: integer
          title: Total Amount Cents
          description: total number of cents spent
        errors:
          type: integer
          title: Errors
          description: number of errors
      type: object
      required:
      - requests
      - input_tokens
      - avg_tpt_ms
      - avg95_tpt_ms
      - total_amount_cents
      - errors
      title: EmbeddingsDeploymentStatsOut
    TimeDeploymentStatsOut:
      properties:
        requests:
          type: integer
          title: Requests
          description: number of inference requests in the provided interval
        total_time_s:
          type: integer
          title: Total Time S
          description: total number of seconds spend in inference
        total_amount_cents:
          type: integer
          title: Total Amount Cents
          description: total number of cents spent
        avg_time_ms:
          type: number
          title: Avg Time Ms
          description: average millisecond inference time
        avg95_time_ms:
          type: number
          title: Avg95 Time Ms
          description: 95th percentile inference time (estimated)
        errors:
          type: integer
          title: Errors
          description: number of errors
      type: object
      required:
      - requests
      - total_time_s
      - total_amount_cents
      - avg_time_ms
      - avg95_time_ms
      - errors
