      operationId: deployment_stats_deploy_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          description: start of period, unix ts or 'now-5h', supported units s(ec), m(min), h(our), d(ay), w(eek), M(onth)
          title: From
        description: start of period, unix ts or 'now-5h', supported units s(ec), m(min), h(our), d(ay), w(eek), M(onth)
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: end of period, unix ts or now-relative, check from, defaults to now
