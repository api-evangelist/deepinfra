        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'A list of statuses that should be returned, separated by comma. Allowed values in the list are: initializing,downloading,deploying,running,updating,stopped,failed,deleted'
          title: Status
