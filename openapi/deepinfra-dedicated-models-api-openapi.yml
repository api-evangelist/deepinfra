  /deploy/{deploy_id}/rebalance:
    post:
      tags:
      - Dedicated Models
      summary: Deploy Rebalance
      description: 'Start a GPU pool rebalance: move GPUs from this deployment onto another

        deployment you own, a target instance at a time unless concurrency raises it.

        A source instance is never left half-moved, so one larger target instance stops

        several of this deployment''s at once, and one larger source instance is replaced

        by several target instances at once. Moving all instances stops this deployment;

        start it again later to resume it.'
      operationId: deploy_rebalance_deploy__deploy_id__rebalance_post
      security:
      - HTTPBearer: []
      parameters:
      - name: deploy_id
        in: path
        required: true
        schema:
          type: string
          title: Deploy Id
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebalanceIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceOut'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Dedicated Models
      summary: Deploy Rebalance Status
      description: 'Status of GPU pool rebalances touching this deployment. A just-started

        rebalance can take a moment to appear. A finished or cancelled rebalance

        leaves both deployments'' min/max instances fixed at the final counts; edit

        them to resume autoscaling.'
      operationId: deploy_rebalance_status_deploy__deploy_id__rebalance_get
      security:
