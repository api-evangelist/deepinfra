          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{instance_id}/launch_token:
    post:
      tags:
      - Agents
      summary: Create Dashboard Launch Token
      description: 'Mint a single-use launch URL for the dashboard.


        Called by the launcher page right when readyz flips ready. The launch URL

        is used as a top-level navigation; /launch then sets the oc_auth cookie

        and 302s into the proxied dashboard.


        The user''s bearer token is stashed in Redis under the token''s jti and

        retrieved (atomic GETDEL) on /launch redeem — this keeps the bearer out of

        the URL and out of any signed payload while preserving the existing proxy

        auth flow (oc_auth cookie value = bearer token).


        Refuses instances whose agent_type has has_dashboard=False (e.g. hermes).'
      operationId: openclaw_launch_token_v1_agents__instance_id__launch_token_post
      security:
      - HTTPBearer: []
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
          title: Instance Id
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenClawLaunchTokenOut'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
