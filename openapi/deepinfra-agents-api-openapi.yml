components:
  schemas:
    OpenClawLaunchTokenOut:
      properties:
        dashboard_url:
          type: string
          title: Dashboard Url
          description: Single-use URL that opens the dashboard. Short TTL; mint right before navigating.
      type: object
      required:
      - dashboard_url
      title: OpenClawLaunchTokenOut
    AgentPlanOut:
      properties:
        id:
          type: string
          title: Id
          description: Plan identifier
        vcpu:
          type: integer
          title: Vcpu
          description: Number of vCPUs
        ram_gb:
          type: integer
          title: Ram Gb
          description: RAM in GB
        price_per_hour:
          type: number
          title: Price Per Hour
          description: Price in USD per hour
        monthly_egress_gb:
          type: integer
          title: Monthly Egress Gb
          description: Included monthly egress allowance in GB
      type: object
      required:
      - id
      - vcpu
      - ram_gb
      - price_per_hour
      - monthly_egress_gb
      title: AgentPlanOut
    AgentInstanceState:
      type: string
      enum:
      - creating
      - starting
      - running
      - stopping
      - stopped
      - failed
      - deleted
      title: AgentInstanceState
    AgentUpdateIn:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
          description: Instance name
      additionalProperties: false
      type: object
      required:
      - name
      title: AgentUpdateIn
    AgentTypeMetaOut:
      properties:
        pretty_name:
          type: string
          title: Pretty Name
          description: Human-readable display name for the framework
        version:
          type: string
          title: Version
          description: Agent framework version
        has_dashboard:
          type: boolean
          title: Has Dashboard
          description: Whether instances of this framework expose a dashboard via the nginx proxy. False -> SSH-only; the UI should hide the dashboard launch affordance and surface the SSH connection string instead.
        self_service_update_command:
          type: string
          title: Self Service Update Command
          description: 'Non-empty when instances of this framework update themselves: the command the customer runs over SSH. POST /{id}/update refuses such instances, so the UI should show this command instead of the in-place Update action and skip the catalog-version comparison (the instance''s version pin does not move after a self-service update).'
          default: ''
        plans:
          items:
            $ref: '#/components/schemas/AgentPlanOut'
          type: array
          title: Plans
          description: Plans available for this agent type
      type: object
      required:
      - pretty_name
      - version
      - has_dashboard
      - plans
      title: AgentTypeMetaOut
    DeepError:
      properties:
        error:
          type: string
          title: Error
          description: Error
          examples:
          - Model not found
      type: object
      required:
      - error
      title: DeepError
    AgentBackupOut:
      properties:
        snapshot_name:
          type: string
          title: Snapshot Name
        size_in_gb:
          type: integer
          title: Size In Gb
        state:
          type: string
          title: State
        created_at_unix:
          type: integer
          title: Created At Unix
      type: object
      required:
      - snapshot_name
      - size_in_gb
      - state
      - created_at_unix
      title: AgentBackupOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AgentInstanceOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        state:
          $ref: '#/components/schemas/AgentInstanceState'
        start_ts:
          type: integer
          title: Start Ts
        state_ts:
          type: integer
          title: State Ts
        stop_ts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Stop Ts
        price_per_hour:
          type: number
          title: Price Per Hour
        region:
          type: string
          title: Region
        last_backup_ts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Backup Ts
        ssh_port:
          type: integer
          title: Ssh Port
        fail_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Fail Reason
        public_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Ip
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        agent_type:
          type: string
          title: Agent Type
        ssh_user:
          type: string
          title: Ssh User
          description: POSIX user the agent runs as inside the VM; also the SSH login user.
        plan_id:
          type: string
          title: Plan Id
      type: object
      required:
      - id
      - name
      - state
      - start_ts
      - state_ts
      - stop_ts
      - price_per_hour
      - region
      - last_backup_ts
      - ssh_port
      - fail_reason
      - public_ip
      - version
      - agent_type
      - ssh_user
      - plan_id
      title: AgentInstanceOut
    AgentCreateIn:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
          description: Instance name
        agent_type_id:
          type: string
          title: Agent Type Id
          description: Agent type identifier
          default: openclaw
        plan_id:
          type: string
          title: Plan Id
          description: Plan identifier
          default: standard
      type: object
      required:
      - name
      title: AgentCreateIn
    AgentCreateOut:
      properties:
        instance_id:
          type: string
          title: Instance Id
          description: Instance ID
      type: object
      required:
