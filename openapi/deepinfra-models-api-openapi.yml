openapi: 3.2.0
info:
  title: DeepInfra Models API
  description: The DeepInfra API provides serverless AI inference, custom model deployments, and GPU rentals.
  version: 1.0.0
servers:
- url: https://api.deepinfra.com
tags:
- name: Models
  description: Browse, search, and manage AI models.
paths:
  /models/private/list:
    get:
      tags:
      - Models
      summary: Private Models List
      operationId: private_models_list_models_private_list_get
      security:
      - HTTPBearer: []
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelOut'
                title: Response Private Models List Models Private List Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /model-families/names:
    get:
      tags:
      - Models
      summary: Model Families Names
      operationId: model_families_names_model_families_names_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Model Families Names Model Families Names Get
  /model-families/{family_name}:
    get:
      tags:
      - Models
      summary: Model Family
      operationId: model_family_model_families__family_name__get
      parameters:
      - name: family_name
        in: path
        required: true
        schema:
          type: string
          title: Family Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFamilyOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /models/list:
    get:
      tags:
      - Models
      summary: Models List
      operationId: models_list_models_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelOut'
                type: array
                title: Response Models List Models List Get
  /models/deployment/list:
    get:
      tags:
      - Models
      summary: Models Deployment List
      operationId: models_deployment_list_models_deployment_list_get
      security:
      - HTTPBearer: []
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelOut'
                title: Response Models Deployment List Models Deployment List Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /models/lora/list:
    get:
      tags:
      - Models
      summary: Models Lora List
      operationId: models_lora_list_models_lora_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelOut'
                type: array
                title: Response Models Lora List Models Lora List Get
  /openrouter/models:
    get:
      tags:
      - Models
      summary: Openrouter Models
      operationId: openrouter_models_openrouter_models_get
      security:
      - HTTPBearer: []
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenRouterModelsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /models/{model_name}/publicity:
    post:
      tags:
      - Models
      summary: Model Publicity
      operationId: model_publicity_models__model_name__publicity_post
      security:
      - HTTPBearer: []
      parameters:
      - name: model_name
        in: path
        required: true
        schema:
          type: string
          title: Model Name
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPublicityIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /models/{model_name}/meta:
    post:
      tags:
      - Models
      summary: Model Meta Update
      operationId: model_meta_update_models__model_name__meta_post
      security:
      - HTTPBearer: []
      parameters:
      - name: model_name
        in: path
        required: true
        schema:
          type: string
          title: Model Name
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelMetaIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /models/{model_name}:
    delete:
      tags:
      - Models
      summary: Model Delete
      operationId: model_delete_models__model_name__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: model_name
        in: path
        required: true
        schema:
          type: string
          title: Model Name
      - name: version
        in: query
        required: true
        schema:
          type: string
          description: delete a particular version, pass 'ALL' to wipe everything
          title: Version
        description: delete a particular version, pass 'ALL' to wipe everything
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Models
      summary: Models Info
      operationId: models_info_models__model_name__get
      security:
      - HTTPBearer: []
      parameters:
      - name: model_name
        in: path
        required: true
        schema:
          type: string
          title: Model Name
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfoOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /models/featured:
    get:
      tags:
      - Models
      summary: Models Featured
      operationId: models_featured_models_featured_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelOut'
                type: array
                title: Response Models Featured Models Featured Get
  /models/{model_name}/schema/{variantKey}:
    get:
      tags:
      - Models
      summary: Model Schema
      operationId: model_schema_models__model_name__schema__variantKey__get
      security:
      - HTTPBearer: []
      parameters:
      - name: model_name
        in: path
        required: true
        schema:
          type: string
          title: Model Name
      - name: variantKey
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SchemaVariantKey'
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaOut'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Not Found
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepError'
          description: Locked
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models:
    get:
      tags:
      - Models
      summary: Openai Models
      operationId: openai_models_v1_models_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort By
      - name: filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/hardware:
    get:
      tags:
      - Models
      summary: Get Hardware
      operationId: get_hardware_v2_hardware_get
      security:
      - HTTPBearer: []
      parameters:
      - name: model
        in: query
        required: true
        schema:
          type: string
          description: Model name (NVIDIA NemoClaw format)
          title: Model
        description: Model name (NVIDIA NemoClaw format)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ModelDocBlock:
      properties:
        key:
          $ref: '#/components/schemas/ModelDocBlockKey'
        url:
          type: string
          title: Url
      type: object
      required:
      - key
      - url
      title: ModelDocBlock
    PricingPageSectionOut:
      properties:
        section_id:
          type: string
          title: Section Id
        ptype:
          $ref: '#/components/schemas/PricingType'
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        mf_description:
          type: string
          title: Mf Description
          description: Model family description for this section, if applicable. Will use description from the section if not set
          default: ''
        entries:
          items:
            $ref: '#/components/schemas/PricingPageEntryOut'
          type: array
          title: Entries
      type: object
      required:
      - section_id
      - ptype
      - title
      - description
      - entries
      title: PricingPageSectionOut
    SchemaOut:
      properties:
        variant:
          $ref: '#/components/schemas/SchemaVariant'
        schema_in:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Schema In
        schema_out:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Schema Out
        schema_stream:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Schema Stream
        fields_in:
          items:
            $ref: '#/components/schemas/ModelFieldInfo'
          type: array
          title: Fields In
      type: object
      required:
      - variant
      - fields_in
      title: SchemaOut
    OpenAIModelsOut:
      properties:
        object:
          type: string
          title: Object
          default: list
        data:
          items:
            $ref: '#/components/schemas/OpenAIModelOut'
          type: array
          title: Data
      type: object
      title: OpenAIModelsOut
    OpenRouterModelsOut:
      properties:
        data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Data
          description: List of available models
      type: object
      required:
      - data
      title: OpenRouterModelsOut
    HFTasksE:
      type: string
      enum:
      - automatic-speech-recognition
      - image-classification
      - question-answering
      - token-classification
      - text-to-image
      - fill-mask
      - zero-shot-image-classification
      - text2text-generation
      - text-generation
      - text-classification
      - object-detection
      - embeddings
      - dreambooth
      - custom
      - text-to-speech
      - text-to-video
      - text-to-music
      - rent-container
      - bare-metal
      - cluster
      - reranker
      - openclaw
      - hermes
      - world-model
      - sandbox
      - web-search
      - commitment
      - capacity
      - decision
      title: HFTasksE
    ModelOut:
      properties:
        model_name:
          type: string
          title: Model Name
          description: Model Name
          examples:
          - microsoft/resnet-50
        type:
          type: string
          title: Type
          description: raw type of the model
          examples:
          - image-classification
        reported_type:
          type: string
          title: Reported Type
          description: reported type of the model
          examples:
          - text-generation
        description:
          type: string
          title: Description
          description: description of the model
          default: ''
          examples:
          - ResNet-50 is a convolutional neural network that is trained on more than a million images from the ImageNet database. It is a 50-layer deep neural network.
        cover_img_url:
          type: string
          title: Cover Img Url
          description: cover image link
          default: ''
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: list of tags
        pricing:
          anyOf:
          - $ref: '#/components/schemas/ModelPricingTime'
          - $ref: '#/components/schemas/ModelPricingTokens'
          - $ref: '#/components/schemas/ModelPricingInputLength'
          - $ref: '#/components/schemas/ModelPricingInputTokens'
          - $ref: '#/components/schemas/ModelPricingUptime'
          - $ref: '#/components/schemas/ModelPricingInputCharacterLength'
          - $ref: '#/components/schemas/ModelPricingImageUnits'
          - $ref: '#/components/schemas/ModelPricingOutputLength'
          - $ref: '#/components/schemas/ModelPricingFrameUnits'
          title: Pricing
          description: The pricing type and cost for this model
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: The maximum context size of this model, if applicable
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
        deprecated:
          anyOf:
          - type: integer
          - type: 'null'
          title: Deprecated
        quantization:
          anyOf:
          - type: string
          - type: 'null'
          title: Quantization
        mmlu:
          anyOf:
          - type: number
          - type: 'null'
          title: Mmlu
        expected:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected
        create_ts:
          anyOf:
          - type: string
          - type: 'null'
          title: Create Ts
        private:
          type: integer
          title: Private
          default: 0
        is_partner:
          type: boolean
          title: Is Partner
          default: false
      type: object
      required:
      - model_name
      - type
      - reported_type
      - pricing
      title: ModelOut
    ModelPricingTime:
      properties:
        discount:
          anyOf:
          - type: number
          - type: 'null'
          title: Discount
          description: Promotional discount; you are charged price * (1 - discount)
          examples:
          - 0.2
        discount_ends_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Discount Ends At
          description: Unix timestamp (seconds) when the discount ends, null when it has no scheduled end
          examples:
          - 1786000000
        short:
          anyOf:
          - type: string
          - type: 'null'
          title: Short
          description: Short description of the pricing, ideal for cards and headers
          examples:
          - $0.15 / second
        full:
          anyOf:
          - type: string
          - type: 'null'
          title: Full
          description: Full description of the pricing, perfect for details
          examples:
          - $0.15 / second for 1080P, $0.10 / second for 720P
        table:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Table
          description: Could be used to generate pricing tables
          examples:
          - columns:
            - resolution
            - $ cost per second
            rows:
            - - 780P
              - $0.10
            - - 1080P
              - $0.15
        type:
          type: string
          title: Type
          default: time
        cents_per_sec:
          type: number
          title: Cents Per Sec
      type: object
      required:
      - cents_per_sec
      title: ModelPricingTime
    ModelPricingFrameUnits:
      properties:
        discount:
          anyOf:
          - type: number
          - type: 'null'
          title: Discount
          description: Promotional discount; you are charged price * (1 - discount)
          examples:
          - 0.2
        discount_ends_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Discount Ends At
          description: Unix timestamp (seconds) when the discount ends, null when it has no scheduled end
          examples:
          - 1786000000
        short:
          anyOf:
          - type: string
          - type: 'null'
          title: Short
          description: Short description of the pricing, ideal for cards and headers
          examples:
          - $0.15 / second
        full:
          anyOf:
          - type: string
          - type: 'null'
          title: Full
          description: Full description of the pricing, perfect for details
          examples:
          - $0.15 / second for 1080P, $0.10 / second for 720P
        table:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Table
          description: Could be used to generate pricing tables
          examples:
          - columns:
            - resolution
            - $ cost per second
            rows:
            - - 780P
              - $0.10
            - - 1080P
              - $0.15
        type:
          type: string
          title: Type
          default: frame_units
        cents_per_frame_unit:
          type: number
          title: Cents Per Frame Unit
      type: object
      required:
      - cents_per_frame_unit
      title: ModelPricingFrameUnits
    ModelInfoOut:
      properties:
        model_name:
          type: string
          title: Model Name
        type:
          type: string
          title: Type
        tags:
          items:
            type: string
          type: array
          title: Tags
        reported_type:
          type: string
          title: Reported Type
        version:
          type: string
          title: Version
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        mf_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Mf Description
        featured:
          type: boolean
          title: Featured
        owner:
          type: boolean
          title: Owner
          default: false
        public:
          type: boolean
          title: Public
        curl_inv:
          type: string
          title: Curl Inv
        cmdline_inv:
          type: string
          title: Cmdline Inv
        txt_docs:
          type: string
          title: Txt Docs
        out_example:
          type: string
          title: Out Example
        out_docs:
          type: string
          title: Out Docs
        in_schema:
          title: In Schema
        out_schema:
          title: Out Schema
        in_fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/ModelFieldInfo'
            type: array
          - type: 'null'
          title: In Fields
        pricing:
          anyOf:
          - $ref: '#/components/schemas/ModelPricingTime'
          - $ref: '#/components/schemas/ModelPricingUptime'
          - $ref: '#/components/schemas/ModelPricingTokens'
          - $ref: '#/components/schemas/ModelPricingInputLength'
          - $ref: '#/components/schemas/ModelPricingInputTokens'
