openapi: 3.2.0
info:
  title: DeepInfra Chat Completions API
  description: The DeepInfra API provides serverless AI inference, custom model deployments, and GPU rentals.
  version: 1.0.0
servers:
- url: https://api.deepinfra.com
tags:
- name: Chat Completions
  description: OpenAI and Anthropic-compatible chat completion endpoints for LLMs.
paths:
  /v1/chat/completions:
    post:
      tags:
      - Chat Completions
      summary: Openai Chat Completions
      operationId: openai_chat_completions_v1_chat_completions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-deepinfra-source
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Deepinfra-Source
      - name: x-deepinfra-service-tier
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Per-request service tier (`priority` or `flex`) for clients that cannot set the `service_tier` body field. The body field wins when both are present; unrecognized values ride the default tier.
          title: X-Deepinfra-Service-Tier
        description: Per-request service tier (`priority` or `flex`) for clients that cannot set the `service_tier` body field. The body field wins when both are present; unrecognized values ride the default tier.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatCompletionsIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /anthropic/v1/messages:
    post:
      tags:
      - Chat Completions
      summary: Anthropic Messages
      operationId: anthropic_messages_anthropic_v1_messages_post
      security:
      - HTTPBearer: []
      parameters:
      - name: anthropic-version
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Anthropic-Version
      - name: anthropic-beta
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Anthropic-Beta
      - name: x-deepinfra-source
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Deepinfra-Source
      - name: x-deepinfra-service-tier
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Per-request service tier (`priority` or `flex`) for clients that cannot set the `service_tier` body field. The body field wins when both are present; unrecognized values ride the default tier.
          title: X-Deepinfra-Service-Tier
        description: Per-request service tier (`priority` or `flex`) for clients that cannot set the `service_tier` body field. The body field wins when both are present; unrecognized values ride the default tier.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /anthropic/v1/messages/count_tokens:
    post:
      tags:
      - Chat Completions
      summary: Anthropic Messages Count Tokens
      operationId: anthropic_messages_count_tokens_anthropic_v1_messages_count_tokens_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-deepinfra-service-tier
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Per-request service tier (`priority` or `flex`) for clients that cannot set the `service_tier` body field. The body field wins when both are present; unrecognized values ride the default tier.
          title: X-Deepinfra-Service-Tier
        description: Per-request service tier (`priority` or `flex`) for clients that cannot set the `service_tier` body field. The body field wins when both are present; unrecognized values ride the default tier.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Xi-Api-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicTokenCountRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnthropicTokenCountRequest:
      properties:
        model:
          type: string
          title: Model
        messages:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Messages
        system:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/AnthropicSystemContent'
            type: array
          - type: 'null'
          title: System
        tools:
          anyOf:
          - items:
              $ref: '#/components/schemas/AnthropicTool'
            type: array
          - type: 'null'
          title: Tools
        thinking:
          anyOf:
          - $ref: '#/components/schemas/AnthropicThinkingConfig'
          - type: 'null'
        tool_choice:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Choice
      type: object
      required:
      - model
      - messages
      title: AnthropicTokenCountRequest
    FunctionDefinition:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
      type: object
      required:
      - name
      title: FunctionDefinition
    JsonSchema:
      properties:
        name:
          type: string
          title: Name
          description: Name identifier for the JSON schema
        schema:
          additionalProperties: true
          type: object
          title: Schema
          description: The actual JSON schema definition
      type: object
      required:
      - name
      - schema
      title: JsonSchema
    JsonObjectResponseFormat:
      properties:
        type:
          type: string
          const: json_object
          title: Type
          default: json_object
      type: object
      title: JsonObjectResponseFormat
    AnthropicSystemContent:
      properties:
        type:
          type: string
          const: text
          title: Type
        text:
          type: string
          title: Text
      type: object
      required:
      - type
      - text
      title: AnthropicSystemContent
    ChatCompletionAssistantMessage:
      properties:
        cache_control:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cache Control
          description: Cache control for prompt caching
        role:
          type: string
          const: assistant
          title: Role
          description: the role of the author of this message
          default: assistant
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/ChatCompletionContentPartText'
            type: array
          - type: 'null'
          title: Content
          description: the message content
        reasoning_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning Content
          description: the reasoning content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChatCompletionMessageToolCall'
            type: array
          - type: 'null'
          title: Tool Calls
          description: the tool calls generated by the mode
      type: object
      title: ChatCompletionAssistantMessage
    ChatCompletionContentPartImage:
      properties:
        type:
          type: string
          const: image_url
          title: Type
        image_url:
          $ref: '#/components/schemas/ImageURL'
      type: object
      required:
      - type
      - image_url
      title: ChatCompletionContentPartImage
    FileData:
      properties:
        file_data:
          anyOf:
          - type: string
          - type: 'null'
          title: File Data
        file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: File Id
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      type: object
      title: FileData
    TextResponseFormat:
      properties:
        type:
          type: string
          const: text
          title: Type
          default: text
      type: object
      title: TextResponseFormat
    ChatCompletionSystemMessage:
      properties:
        cache_control:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cache Control
          description: Cache control for prompt caching
        role:
          type: string
          const: system
          title: Role
          description: the role of the author of this message
          default: system
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/ChatCompletionContentPartText'
            type: array
          title: Content
          description: the message content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - content
      title: ChatCompletionSystemMessage
    VideoURL:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
      - url
      title: VideoURL
    AnthropicThinkingConfig:
      properties:
        type:
          anyOf:
          - type: string
            enum:
            - enabled
            - disabled
            - adaptive
          - type: 'null'
          title: Type
        budget_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Budget Tokens
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      type: object
      title: AnthropicThinkingConfig
      description: 'Anthropic `thinking` config: {type: enabled|disabled|adaptive, budget_tokens}.


        `enabled` is a legacy pre-spec field this endpoint used to accept; it only

        applies when `type` is absent.'
    OpenAIChatCompletionsIn:
      properties:
        service_tier:
          anyOf:
          - $ref: '#/components/schemas/ServiceTier'
          - type: 'null'
          description: The service tier used for processing the request. 'priority' processes the request with higher priority (premium rate); 'flex' processes it at lower priority for a discount, served only when spare capacity exists and may be retried/timed out under load. Both apply only to models that support the respective tier. For compatibility, 'auto' is treated as 'priority' and 'standard_only' as 'default'.
        fail_fast:
          type: boolean
          title: Fail Fast
          description: If true, the request is rejected immediately with HTTP 429 when the model has no spare capacity, instead of waiting in the queue. Opt-in; the default (false) keeps standard queueing behavior.
          default: false
        models:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 4
            minItems: 1
          - type: 'null'
          title: Models
          description: 'Ordered list of up to 4 fallback models. The request is attempted on each model in order: when a model rejects it for lack of capacity (HTTP 429 model-busy / flex no-capacity), the next model is tried server-side. The first model that accepts serves the request; the response''s model field and billing reflect that model, at that model''s pricing. Models before the last are attempted without queueing (as if fail_fast were set); the last model honors the request''s own fail_fast value. When models is set, the model field is ignored. Entries must be plain model names (no deploy_id:, custom_hostport, or :revision specifiers); duplicate entries are ignored, keeping the first occurrence.'
        model:
          type: string
          title: Model
          description: model name
          examples:
          - meta-llama/Llama-2-70b-chat-hf
        messages:
          items:
            oneOf:
            - $ref: '#/components/schemas/ChatCompletionToolMessage'
            - $ref: '#/components/schemas/ChatCompletionAssistantMessage'
            - $ref: '#/components/schemas/ChatCompletionUserMessage'
            - $ref: '#/components/schemas/ChatCompletionSystemMessage'
          type: array
          title: Messages
          description: 'conversation messages: (user,assistant,tool)*,user including one system message anywhere'
        stream:
          type: boolean
          title: Stream
          description: whether to stream the output via SSE or return the full response
          default: false
        temperature:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Temperature
          description: What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic
          default: 1.0
        top_p:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Top P
          description: An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered.
          default: 1.0
        min_p:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min P
          description: Float that represents the minimum probability for a token to be considered, relative to the probability of the most likely token. Must be in [0, 1]. Set to 0 to disable this.
          default: 0.0
        top_k:
          type: integer
          exclusiveMaximum: 1000.0
          minimum: 0.0
          title: Top K
          description: Sample from the best k (number of) tokens. 0 means off
          default: 0
        max_tokens:
          anyOf:
          - type: integer
            maximum: 10000000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Max Tokens
          description: 'The maximum number of tokens to generate in the chat completion.


            The total length of input tokens and generated tokens is limited by the model''s context length. If explicitly set to None it will be the model''s max context length minus input length or 65536, whichever is smaller.'
        stop:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stop
          description: up to 16 sequences where the API will stop generating further tokens
        stop_token_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Stop Token Ids
          description: Up to 16 token IDs where the API will stop generating further tokens. Merged with the model's built-in stop tokens. Intended for private deployments.
        n:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: N
          description: number of sequences to return
          default: 1
        presence_penalty:
          type: number
          maximum: 2.0
          minimum: -2.0
          title: Presence Penalty
          description: Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.
          default: 0
        frequency_penalty:
          type: number
          maximum: 2.0
          minimum: -2.0
          title: Frequency Penalty
          description: Positive values penalize new tokens based on how many times they appear in the text so far, increasing the model's likelihood to talk about new topics.
          default: 0
        tools:
          anyOf:
          - items:
              $ref: '#/components/schemas/FunctionTool'
            type: array
          - type: 'null'
          title: Tools
          description: A list of tools the model may call. Currently, only functions are supported as a tool.
        tool_choice:
          anyOf:
          - type: string
            enum:
            - none
            - auto
            - required
          - $ref: '#/components/schemas/FunctionTool'
          - type: 'null'
          title: Tool Choice
          description: Controls which (if any) function is called by the model. none means the model will not call a function and instead generates a message. auto means the model can pick between generating a message or calling a function. required means the model must call a function. defined tool means the model must call that specific tool. none is the default when no functions are present. auto is the default if functions are present.
        response_format:
          anyOf:
          - $ref: '#/components/schemas/TextResponseFormat'
          - $ref: '#/components/schemas/JsonObjectResponseFormat'
          - $ref: '#/components/schemas/JsonSchemaResponseFormat'
          - $ref: '#/components/schemas/RegexResponseFormat'
          - type: 'null'
          title: Response Format
          description: The format of the response. Currently, only json is supported.
        repetition_penalty:
          type: number
          maximum: 5.0
          minimum: 0.01
          title: Repetition Penalty
          description: Alternative penalty for repetition, but multiplicative instead of additive (> 1 penalize, < 1 encourage)
          default: 1
        user:
          anyOf:
          - type: string
          - type: 'null'
          title: User
          description: A unique identifier representing your end-user, which can help monitor and detect abuse. Avoid sending us any identifying information. We recommend hashing user identifiers.
        seed:
          anyOf:
          - type: integer
            exclusiveMaximum: 1.8446744073709552e+19
            minimum: -9.223372036854776e+18
          - type: 'null'
          title: Seed
          description: Seed for random number generator. If not provided, a random seed is used. Determinism is not guaranteed.
        logprobs:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Logprobs
          description: Whether to return log probabilities of the output tokens or not.If true, returns the log probabilities of each output token returned in the `content` of `message`.
        stream_options:
          anyOf:
          - $ref: '#/components/schemas/StreamOptions'
          - type: 'null'
          description: streaming options
        reasoning_effort:
          anyOf:
          - type: string
            enum:
            - none
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
          - type: 'null'
          title: Reasoning Effort
          description: Constrains effort on reasoning for reasoning models. Currently supported values are none, minimal, low, medium, high, xhigh, and max. Reducing reasoning effort can result in faster responses and fewer tokens used on reasoning in a response. Setting to none disables reasoning entirely if the model supports.
        reasoning:
          anyOf:
          - $ref: '#/components/schemas/ChatReasoningSettings'
          - type: 'null'
          description: Reasoning configuration.
        prompt_cache_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Cache Key
          description: A key to identify prompt cache for reuse across requests. If provided, the prompt will be cached and can be reused in subsequent requests with the same key.
        prompt_cache_options:
          anyOf:
          - $ref: '#/components/schemas/PromptCacheOptions'
          - type: 'null'
          description: 'Prompt cache options for this request''s prefix, e.g. {"ttl": "1h"}.'
        chat_template_kwargs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Chat Template Kwargs
          description: Chat template kwargs.
        media_io_kwargs:
          anyOf:
          - $ref: '#/components/schemas/MediaIoKwargs'
          - type: 'null'
          description: 'Per-request media decode options keyed by modality, e.g. {"video": {"num_frames": 16}}. Honoured by video-input models served on vLLM or Dynamo; ignored elsewhere.'
        continue_final_message:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Continue Final Message
          description: If set, the final assistant message is used as a prefix for the model to continue generating from, rather than starting a new turn. Only applicable when the last message in the conversation is an assistant message.
        ignore_eos:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ignore Eos
          description: Keep generating until max_tokens instead of stopping at the end-of-sequence token. Only honoured on models tagged with the allow_ignore_eos feature flag; ignored otherwise. Intended for benchmarking, where a fixed output length is needed.
      type: object
      required:
      - model
      - messages
      title: OpenAIChatCompletionsIn
    ChatCompletionContentPartText:
      properties:
        type:
          type: string
          const: text
          title: Type
        text:
          type: string
          title: Text
        prompt_cache_breakpoint:
          anyOf:
          - $ref: '#/components/schemas/PromptCacheBreakpoint'
          - type: 'null'
          description: Marks the end of the prefix that prompt_cache_options retention applies to.
      type: object
      required:
      - type
      - text
      title: ChatCompletionContentPartText
    ChatCompletionToolMessage:
      properties:
        cache_control:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cache Control
          description: Cache control for prompt caching
        role:
          type: string
          const: tool
          title: Role
          description: the role of the author of this message
          default: tool
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/ChatCompletionContentPartText'
            type: array
          title: Content
          description: the message content
        tool_call_id:
          type: string
          title: Tool Call Id
      type: object
      required:
      - content
      - tool_call_id
      title: ChatCompletionToolMessage
    StreamOptions:
      properties:
        include_usage:
          type: boolean
          title: Include Usage
          description: whether to include usage data
          default: true
        continuous_usage_stats:
          type: boolean
          title: Continuous Usage Stats
          description: whether to include usage stats continuously with each streaming event
          default: false
      type: object
      title: StreamOptions
    InputAudio:
      properties:
        data:
          type: string
          title: Data
        format:
          type: string
          enum:
          - wav
          - mp3
          title: Format
          default: wav
      type: object
      required:
      - data
      title: InputAudio
    ChatCompletionUserMessage:
      properties:
        cache_control:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cache Control
          description: Cache control for prompt caching
        role:
          type: string
          const: user
          title: Role
          description: the role of the author of this message
          default: user
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/ChatCompletionContentPartText'
              - $ref: '#/components/schemas/ChatCompletionContentPartImage'
              - $ref: '#/components/schemas/ChatCompletionContentPartAudio'
              - $ref: '#/components/schemas/ChatCompletionContentPartVideo'
              - $ref: '#/components/schemas/ChatCompletionContentPartFile'
            type: array
          title: Content
          description: the message content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - content
      title: ChatCompletionUserMessage
    AnthropicMessagesIn:
      properties:
        service_tier:
          anyOf:
          - $ref: '#/components/schemas/ServiceTier'
          - type: 'null'
          description: The service tier used for processing the request. 'priority' processes the request with higher priority (premium rate); 'flex' processes it at lower priority for a discount, served only when spare capacity exists and may be retried/timed out under load. Both apply only to models that support the respective tier. For compatibility, 'auto' is treated as 'priority' and 'standard_only' as 'default'.
        fail_fast:
          type: boolean
          title: Fail Fast
          description: If true, the request is rejected immediately with HTTP 429 when the model has no spare capacity, instead of waiting in the queue. Opt-in; the default (false) keeps standard queueing behavior.
          default: false
        models:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 4
            minItems: 1
          - type: 'null'
          title: Models
          description: 'Ordered list of up to 4 fallback models. The request is attempted on each model in order: when a model rejects it for lack of capacity (HTTP 429 model-busy / flex no-capacity), the next model is tried server-side. The first model that accepts serves the request; the response''s model field and billing reflect that model, at that model''s pricing. Models before the last are attempted without queueing (as if fail_fast were set); the last model honors the request''s own fail_fast value. When models is set, the model field is ignored. Entries must be plain model names (no deploy_id:, custom_hostport, or :revision specifiers); duplicate entries are ignored, keeping the first occurrence.'
        model:
          type: string
          title: Model
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
        messages:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Messages
        system:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/AnthropicSystemContent'
            type: array
          - type: 'null'
          title: System
        stop_sequences:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stop Sequences
        stream:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Stream
          default: false
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          default: 1.0
        top_p:
          anyOf:
          - type: number
          - type: 'null'
